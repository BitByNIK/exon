# Git hooks, run by .githooks/pre-commit inside the dev container.
# Before each commit, format the staged Go and Markdown files and add the
# formatted versions to the commit.

# The hook script lives in .githooks/; never let lefthook write its own.
no_auto_install: true

pre-commit:
  jobs:
    - name: go
      glob: "*.go"
      run: gofumpt -w {staged_files}
      stage_fixed: true
    - name: markdown
      glob: "*.md"
      run: rumdl fmt {staged_files}
      stage_fixed: true
